name: PR CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-ci:
    name: pr-ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Lint
        run: uv run ruff check src tests

      - name: Test
        run: uv run pytest

      - name: HarnessOps doctor
        run: uv run --with-editable . hops doctor --check-overlay --check-records

      - name: Migration check
        run: uv run --with-editable . hops migrate --check
