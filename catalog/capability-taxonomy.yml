version: 0.1.0
capabilities:
  - id: feedback_routing
    definition: 失敗を project、target、meta、protocol、external、private のdispositionに分類する。
    evidence: 根拠を持つルーティング済みレコードと、上流汚染がないこと。
  - id: overlay_generation
    definition: `.harnessops/`、`harness-feedback/`、`harness-lab/` を安全に作成する。
    evidence: initテストとロックファイルの管理対象ファイルハッシュ。
  - id: migration_safety
    definition: 人が作成したレコードを削除または上書きせずに生成ファイルを更新する。
    evidence: ロックハッシュ、競合時の挙動、マイグレーションエントリ。
  - id: plugin_bridge
    definition: 状態変更を `hops` に委譲し、プラグインUXを薄く保つ。
    evidence: スキルがCLIコマンドを呼び、管理対象構造を直接編集しないこと。
  - id: public_terminology
    definition: ローカル/非公開語彙が公開成果物へ漏れるのを防ぐ。
    evidence: サニタイザテストと、非公開語フィクスチャを含む評価ケース。
  - id: manifest_integrity
    definition: プロバイダ、リポジトリ種別、バージョン、推奨プロファイルを検出する。
    evidence: `.harness/manifest.toml` 検証とフィクスチャ検出。
  - id: slurm_safety_gate
    definition: 外部/HPCアクションの前に明示的な人間ゲートを必須にする。
    evidence: ターゲットハーネスの品質チェックと、HarnessOps MVP がリモートアクションを行わないこと。
  - id: evaluation_discipline
    definition: 採用前に評価ケース、スコアカード、証拠、判断を必須にする。
    evidence: 仮説の中止基準と採用済み判断のガードチェック。
  - id: privacy_sanitization
    definition: ローカルパス、保護パス、非公開語、送信元プロジェクト識別情報を伏せる。
    evidence: サニタイズ済みバンドルとプライバシーテスト。
  - id: anti_theater
    definition: 手続き的には見えるが失敗クラスを減らさない追加を検出する。
    evidence: スコアカードの `anti_theater` 軸と判断根拠。
  - id: schema_validation
    definition: レコード、プロファイル、マニフェスト、マイグレーションメタデータを明示的契約に照らして検証する。
    evidence: `hops doctor --check-records` とJSON Schema。
