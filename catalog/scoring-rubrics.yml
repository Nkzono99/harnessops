version: 0.1.0
rubrics:
  default_manual:
    scale: "0..5。0は欠如/高リスク、5は強い/低リスクを意味する"
    dimensions:
      - id: impact
        question: 実際に観測された失敗クラスを減らすか。
      - id: mechanism_clarity
        question: 因果メカニズムは評価できるほど明示されているか。
      - id: evaluability
        question: 紐づく評価ケースまたはコマンドが成功/失敗を検出できるか。
      - id: minimality
        question: 機能する最小の変更か。
      - id: regression_risk
        question: 他のワークフローを壊す可能性はどの程度か。高リスクは低スコアとして逆採点する。
      - id: operator_burden
        question: 人間の負担を減らす、または少なくとも増やさないか。
      - id: anti_theater
        question: 改善に見えるだけのプロセス追加を避けているか。
      - id: maintainability
        question: オーナーが長期的に保守できるか。
      - id: privacy_sanitization_risk
        question: 非公開文脈の漏えいを避けているか。
