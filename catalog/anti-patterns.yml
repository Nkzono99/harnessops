version: 0.1.0
anti_patterns:
  - id: reflection_theater
    definition: エージェントが評価ケース、ガード、判断を作らずに振り返りだけを書く。
    prevention: 観測を失敗レコードに変換してルーティングする。
  - id: governance_theater
    definition: ルール、文書、スキルは増えるが失敗クラスは減らない。
    prevention: 紐づく失敗クラスと anti-theater スコアを必須にする。
  - id: skill_proliferation
    definition: CLIへ集約せず、重複するスキルによってワークフロー面が広がる。
    prevention: プラグインを薄く保ち、`hops` を呼び出す。
  - id: self_approving_judge
    definition: 同じコンテキストが、独立した証拠なしに変更を生成して承認する。
    prevention: スコアカード、判断証拠、オーナーレビューを必須にする。
  - id: metric_hacking
    definition: 実運用が悪化しているのに単一スコアだけが最適化される。
    prevention: 多軸スコアカードと回帰リスクを使う。
  - id: upstream_pollution
    definition: プロジェクト固有の判断が上流テンプレートやプロトコルに入り込む。
    prevention: プロジェクト発展は `research/` または `notes/` に回し、エクスポート前にサニタイズする。
  - id: context_leakage
    definition: 非公開研究、ローカルパス、クラスタ名、未公開語が漏れる。
    prevention: 既定の非公開可視性とサニタイザ設定を使う。
  - id: endless_meta_improvement
    definition: 方法論がサイクルごとに変わり、比較不能になる。
    prevention: メタ変更は `harness-lab/` に置き、証拠を必須にする。
