version: 0.1.0
failure_classes:
  - id: project_specific_logic_leaks_into_template
    definition: プロジェクト専用の前提が再利用テンプレートや上流既定値にコピーされる。
    severity: high
    default_disposition: target-upstream-candidate
    detection_hints:
      - テンプレートにローカルパス、データセット、クラスタ、未公開研究語が含まれる
      - 生成プロジェクトが過去プロジェクトの判断を含んだ状態で始まる
    related_capabilities: [harness_update_without_overwrite, feedback_routing]
  - id: update_harness_overwrites_local_edits
    definition: 更新コマンドが、安全なマージや競合コピーなしに人が書いたプロジェクトファイルを置き換える。
    severity: critical
    default_disposition: target-upstream-candidate
    detection_hints:
      - 明示的な同意なしに更新後のローカルファイルハッシュが変化する
      - ロックメタデータが上書きを説明できない
    related_capabilities: [harness_update_without_overwrite, migration_safety]
  - id: shallow_project_health_check
    definition: 重要な状態または来歴が欠けているのに doctor やヘルスチェックが通る。
    severity: medium
    default_disposition: target-upstream-candidate
    detection_hints:
      - コマンドは成功を報告するが必須ルートが存在しない
      - 生成ビューが古いのに報告されない
    related_capabilities: [manifest_integrity]
  - id: slurm_action_without_human_gate
    definition: 明示的な人間安全ゲートなしにHPCまたはSlurmアクションを投入できる。
    severity: critical
    default_disposition: target-upstream-candidate
    detection_hints:
      - 確認なしにエージェントワークフローからジョブ投入コマンドが実行される
      - リソース制限がない、または検証されていない
    related_capabilities: [slurm_safety_gate]
  - id: manifest_provenance_gap
    definition: プロジェクトが、どのハーネス/プロバイダ/バージョンに生成または所有されているか説明できない。
    severity: high
    default_disposition: protocol-candidate
    detection_hints:
      - `.harness/manifest.toml` に provider または kind がない
      - 推奨プロファイルを解決できない
    related_capabilities: [manifest_integrity]
  - id: local_patch_not_classified
    definition: ローカル回避策にdisposition、有効期限、上流ターゲットがない。
    severity: medium
    default_disposition: project-local-process
    detection_hints:
      - パッチファイルやメモにターゲットまたは期限がない
      - 回避策が複数プロジェクトで繰り返される
    related_capabilities: [feedback_routing]
  - id: local_vocabulary_leakage
    definition: 非公開プロジェクト用語が公開原稿、フィードバック、テンプレート、Issue本文に現れる。
    severity: high
    default_disposition: target-upstream-candidate
    detection_hints:
      - サニタイザの private_terms がエクスポート内容に一致する
      - 公開下書きが内部データセットまたは手法コードを参照する
    related_capabilities: [public_terminology, privacy_sanitization]
  - id: governance_theater
    definition: 文書、ルール、プロセスが増えるが失敗クラスは減らない。
    severity: high
    default_disposition: meta-harness-candidate
    detection_hints:
      - 新しい文書に評価ケースまたは判断証拠がない
      - 仮説に中止基準がない
    related_capabilities: [anti_theater, evaluation_discipline]
  - id: skill_proliferation
    definition: 既存ワークフロー責務を統合せず、新しいスキルが追加される。
    severity: medium
    default_disposition: meta-harness-candidate
    detection_hints:
      - スキルが既存CLIワークフローと重複する
      - スキルが `hops` を呼ばずに状態変更ロジックを含む
    related_capabilities: [plugin_bridge]
  - id: routing_gap
    definition: HarnessOps がプロジェクト発展と上流/メタフィードバックを区別できない。
    severity: high
    default_disposition: meta-harness-candidate
    detection_hints:
      - 同じイベントに複数レコードが必要なのに、コマンドが曖昧な1レコードだけを作る
      - プロジェクト方針転換が上流テンプレート変更としてルーティングされる
    related_capabilities: [feedback_routing]
  - id: schema_gap
    definition: レコードまたはプロファイルスキーマが、安全運用に必要な不変条件を表現できない。
    severity: high
    default_disposition: meta-harness-candidate
    detection_hints:
      - 証拠または中止基準を欠くレコードを doctor が通す
      - プロファイルがサニタイザで使う非公開パスを省いている
    related_capabilities: [schema_validation]
