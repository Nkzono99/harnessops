schema_version: '0.1'
kind: harness_lab_patterns
updated_at: '2026-05-19T03:10:00+09:00'
source_digest: d07f7af9dc86f34f5009ddd43ba78b8ba67b53260128bf3e41821c36573cdc23
patterns:
- id: lab_first_improvement_loop
  name: Lab-first improvement loop
  capability: improvement_loop_design
  failure_class: ambiguous_improvement_workflow
  applies_when:
  - A HarnessOps change affects CLI behavior, skills, bridge contracts, release behavior, schema, or protocol-level workflow.
  - The observation is local but may become a reusable failure class or promotion candidate.
  avoid_when:
  - The change is a trivial mechanical edit with no behavioral or workflow implication.
  evidence:
  - source: IMP0001
    note: Local HarnessOps improvements could ship without a lab trace until capture/eval guidance was made first-class.
  - source: IMP0006
    note: The standard loop became explicit about observation, investigation, classification, hypothesis, evaluation, decision, guard, and promotion.
  guard:
  - path: tests/test_cli/test_mvp_flow.py
    sources: [IMP0006]
  counterexamples:
  - source: IMP0001
    note: Storage existed, but without a first-step capture path the trace was still skipped.
- id: bounded_meta_scan
  name: Bounded in-task meta-hypothesis scan
  capability: meta_hypothesis_scan
  failure_class: missed_second_order_observation
  applies_when:
  - Work is interrupted by a reusable design concern, repeated friction, migration/compatibility decision, evaluation gap, or external analogy.
  - The observation affects future agent behavior or cross-project promotion.
  avoid_when:
  - The idea is merely interesting and does not change future behavior, evaluation, migration, or promotion.
  evidence:
  - source: IMP0007
    note: The run-lab skills now instruct agents to run a bounded scan at meaningful checkpoints.
  guard:
  - path: tests/test_agent_harness_contract.py
    sources: [IMP0007]
  counterexamples:
  - source: IMP0007
    note: Broad autonomous capture would create noisy meta-records.
- id: deliberate_research_scan
  name: Deliberate meta-improvement research scan
  capability: meta_improvement_research
  failure_class: unstructured_research_scan_results
  applies_when:
  - A user asks for meta-level improvement research or a candidate list needs local, codebase, and external evidence.
  - Multiple candidates must be compared before routing to investigate, capture, propose, park, or reject.
  avoid_when:
  - A single known failure already has a clear feedback record and hypothesis path.
  evidence:
  - source: IMP0008
    note: The manual research skill is separate from the shorter in-task meta scan and must route durable outputs through the lab.
  - source: IMP0009
    note: Research scans persist evidence, candidates, relation, recommendation, and next command.
  - source: RS0001
    note: The first scan recommended using RS records for deliberate multi-candidate meta-improvement research.
  guard:
  - path: tests/test_agent_harness_contract.py
    sources: [IMP0008]
  - path: tests/test_cli/test_mvp_flow.py
    sources: [IMP0009]
  counterexamples:
  - source: RS0001
    note: A new record type creates meta-noise if used for every small observation.
- id: source_linked_memory_compaction
  name: Source-linked memory compaction
  capability: lab_memory_compaction
  failure_class: record_sprawl_without_knowledge_consolidation
  applies_when:
  - Lab record count, byte count, or improvement count crosses thresholds.
  - The abstraction targets are missing, stale, or manually requested.
  avoid_when:
  - The operator wants an adoption decision; compact memory is only an index and working memory.
  evidence:
  - source: IMP0014
    note: Compaction preserves canonical records and keeps mutable knowledge source-linked.
  - source: IMP0015
    note: Lint/prepare separate trigger detection and input bundling from semantic abstraction.
  guard:
  - path: tests/test_cli/test_mvp_flow.py
    sources: [IMP0014, IMP0015]
  counterexamples:
  - source: IMP0015
    note: Relying only on a skill loses cheap digest checks and machine-readable source indexes.
- id: deterministic_health_intake
  name: Deterministic health intake before steward routing
  capability: daily_steward_orchestration
  failure_class: count_based_preflight_misses_stale_lab_health
  applies_when:
  - A scheduled steward run needs to choose lanes from repository state.
  - A lab repository has read-only health signals such as stale snapshot, stale semantic memory, pressure thresholds, doctor warnings, or migration status.
  avoid_when:
  - The repository is a project-side feedback source without harness-lab memory.
  - The command would need to write files, rank speculative candidates, or perform semantic abstraction.
  evidence:
  - source: IMP0023
    note: Daily steward preflight became the deterministic intake point for pull-first safety, doctor, migration, overlay counts, lane triggers, and run ledger state.
  - source: IMP0029
    note: Preflight now exposes lab_health from the existing read-only memory lint result and routes stale memory to the librarian lane.
  - source: IMP0031
    note: Daily steward guidance now separates systemic candidates, metadata/guard backfills, and read-only decisions, then finishes validated work through an automation branch and PR/merge path.
  - source: RS0005
    note: The research scan recommended adding lab_health narrowly while keeping downstream judgment in the librarian lane.
  guard:
  - path: tests/test_cli/test_steward.py
    sources: [IMP0023, IMP0029]
  - path: tests/test_agent_harness_contract.py
    sources: [IMP0023, IMP0029, IMP0031]
  counterexamples:
  - source: RS0005
    note: Putting too much analysis into preflight would turn the steward into a workflow engine instead of deterministic intake.
  - source: IMP0031
    note: A run that only pushes a branch, or direct-pushes protected main, fails the reviewable automation path.
- id: version_aware_update_notice
  name: Version-aware uvx update notice
  capability: uvx_update_guidance
  failure_class: stale_hops_update_path
  applies_when:
  - A linked repository runs `hops` and its recorded HarnessOps version, current runtime version, or latest PyPI version can differ.
  - The next action should guide agents through a reproducible update path without applying migrations implicitly.
  avoid_when:
  - The command is already the explicit update or migration command and repeating the notice would add noise.
  - Network/PyPI lookup is disabled; local recorded/current comparison should still be low-noise.
  evidence:
  - source: IMP0030
    note: Existing update notice behavior now compares recorded, current, and latest PyPI versions and points to `uvx --refresh-package harnessops --from harnessops hops update-harness`.
  guard:
  - path: tests/test_cli/test_mvp_flow.py::test_hops_usage_notices_stale_harnessops_lock_once; tests/test_cli/test_mvp_flow.py::test_hops_usage_notices_when_current_runtime_is_behind_pypi; tests/test_cli/test_mvp_flow.py::test_update_notice_handles_unreleased_runtime_ahead_of_pypi; tests/test_cli/test_mvp_flow.py::test_update_notice_warns_when_repo_lock_is_newer_than_runtime
    sources: [IMP0030]
  counterexamples:
  - source: IMP0030
    note: Treating FB0028 as only a stale-lock duplicate would leave latest-PyPI drift and uvx refresh guidance untraceable.
- id: reviewable_automation_branch_merge
  name: Reviewable automation branch merge
  capability: daily_steward_orchestration
  failure_class: missing_lab_capture
  applies_when:
  - A scheduled steward run has validated local changes and remote-write authorization.
  - The repo uses protected `main` or an explicit integration branch as the merge target.
  avoid_when:
  - Validation failed, required checks are pending or failing, the target branch is behind/diverged, or the run lacks remote-write authorization.
  evidence:
  - source: IMP0031
    note: 'Daily steward docs and packaged skills now prefer GitHub Flow: automation feature branch, PR, and merge after validation and required checks.'
  - source: IMP0035
    note: GitHub Flow merge now supports auto, merge, squash, and rebase methods so repositories with merge commits disabled can still complete after checks pass.
  guard:
  - path: tests/test_agent_harness_contract.py::test_daily_steward_automation_prompt_is_documented; tests/test_agent_harness_contract.py::test_daily_steward_skill_is_packaged_for_agents
    sources: [IMP0031]
  - path: tests/test_cli/test_mvp_flow.py
    sources: [IMP0035]
  counterexamples:
  - source: IMP0031
    note: Direct protected-branch pushes or unbounded systemic candidates are explicit kill criteria.
  - source: IMP0035
    note: Always invoking `gh pr merge --merge` blocks repositories that require squash or rebase even when validation and checks passed.
- id: no_argument_issue_triage
  name: No-argument open issue triage
  capability: daily_steward_orchestration
  failure_class: target_specific_issue_triage_drift
  applies_when:
  - A steward or issue-triage run receives no specific issue number but the repository may have open GitHub issues.
  - A target repository is replacing local triage prompts with HarnessOps-distributed issue triage behavior.
  avoid_when:
  - GitHub access is unavailable and the run cannot gather issue body, comments, labels, or reproduction details.
  - The requested action is a remote close/comment/label and explicit authority is absent.
  evidence:
  - source: IMP0032
    note: HOPS issue triage now covers no-argument open issue discovery, priority buckets, close-candidate heuristics, remote-action authority boundaries, and completion close conventions.
  - source: IMP0023
    note: Daily steward delegates issue intake to the issue-triager lane while keeping state changes in HOPS records.
  guard:
  - path: tests/test_agent_harness_contract.py
    sources: [IMP0032]
  counterexamples:
  - source: IMP0032
    note: A repo-local triage skill can drift from HarnessOps routing and remote-action safety rules.
- id: risk_budgeted_no_idle_steward
  name: Risk-budgeted no-idle steward
  capability: daily_steward_orchestration
  failure_class: over_conservative_automation_loop
  applies_when:
  - A clean scheduled steward run has no obvious reactive issue, feedback, doctor, update, or lab-health blocker.
  - Automation authority includes PR, merge, issue, or release actions, so the loop should generate or advance work rather than only report state.
  avoid_when:
  - Global gates fail, privacy risk is unresolved, validation failed, or the run has exhausted explicit discovery/work-packet budget.
  evidence:
  - source: FB0037
    note: The previous daily automation shape gave strong remote authority but retained a weak discovery trigger, a single systemic-candidate cap, and status-only no-op as a normal result.
  - source: FB0038
    note: Update-harness/latest-runtime work belongs in the steward update lane only when stale state is signaled; starting every run with latest update would blur validation.
  guard:
  - path: tests/test_agent_harness_contract.py::test_daily_steward_automation_prompt_is_documented; tests/test_agent_harness_contract.py::test_daily_steward_skill_is_packaged_for_agents; tests/test_agent_harness_contract.py::test_meta_improvement_research_skill_is_packaged
    sources: [FB0037, FB0038]
  counterexamples:
  - source: FB0037
    note: Record-level research and queue creation should not require implementation-level validation/guard; merge and release still do.
- id: explicit_open_meta_scan_handoff
  name: Explicit open meta scan handoff
  capability: daily_steward_orchestration
  failure_class: implicit_lane_contract
  applies_when:
  - A daily steward supervisor needs divergent structural critique before evidence/routing and priority execution.
  - Raw ideas should be visible as their own lane result rather than hidden inside invention work.
  avoid_when:
  - The run lacks subagent authorization and must report inline fallback instead.
  - The repository role is a project feedback source where lab records cannot be created.
  evidence:
  - source: IMP0034
    note: The steward supervisor now includes `hops-open-meta-scan` as an explicit lane before invention; invention reviews raw ideas and records selected candidates for priority-improvement.
  - source: FB0050
    note: Code review found that raw ideas needed a structured lane artifact and that subagent recommendations should use actual supervisor lane names instead of signal aliases.
  - source: IMP0036
    note: Steward preflight and lane-result validation now expose and enforce the open-meta artifact contract.
  guard:
  - path: tests/test_cli/test_steward.py::test_steward_preflight_json_reports_run_ledger
    sources: [IMP0034, FB0050]
  - path: tests/test_agent_harness_contract.py::test_daily_steward_skill_is_packaged
    sources: [IMP0034]
  - path: tests/test_cli/test_steward.py::test_steward_run_validates_lane_result_json
    sources: [FB0050, IMP0036]
  counterexamples:
  - source: IMP0034
    note: Nesting `hops-open-meta-scan` inside `hops-invention-steward` left the supervisor without a dedicated subagent result or durable raw-idea handoff.
  - source: FB0050
    note: A supervisor recommendation using `issue-triager` or a prose-only raw-idea handoff can make a downstream agent record the wrong lane or miss the handoff entirely.
- id: consolidation_first_steward_routing
  name: Consolidation-first steward routing
  capability: daily_steward_supervision
  failure_class: autonomous_record_growth_without_selection_pressure
  applies_when:
  - A daily steward run produces raw ideas, research scans, or candidate work while lab file-count pressure is already high.
  - Existing feedback, improvement dossiers, or research scans can absorb the candidate without creating a new queue root.
  avoid_when:
  - The observation is a new failure class with no existing source record and would be lost without capture.
  - The lane is explicitly read-only and should only return raw ideas for later routing.
  evidence:
  - source: RS0006
    note: Open-meta warned that autonomous runs can reward producing records faster than retiring, merging, rejecting, or testing them.
  - source: IMP0036
    note: Structured lane artifacts make it possible for downstream lanes to route raw ideas without parsing prose.
  guard:
  - path: tests/test_cli/test_steward.py
    sources: [IMP0036]
  counterexamples:
  - source: RS0006
    note: Over-correcting can suppress useful raw discoveries; keep open-meta noisy and enforce consolidation in downstream routing.
- id: required_check_aware_github_flow
  name: Required-check-aware GitHub Flow
  capability: github_flow_automation
  failure_class: missing_required_check_gate
  applies_when:
  - A repository expects automation PRs to merge through branch protection and required checks.
  - The merge command must explain whether checks are absent, pending, failing, or satisfied.
  avoid_when:
  - The repository has no remote-write authority or no documented protected-branch policy for the run.
  evidence:
  - source: FB0041
    note: HarnessOps needed a real PR CI workflow and merge diagnostics that distinguish missing required checks from failing checks before branch protection can be made reliable.
  - source: IMP0035
    note: Merge completion must also select a repository-compatible merge method after required checks pass.
  guard:
  - path: .github/workflows/pr-ci.yml; tests/test_cli/test_mvp_flow.py; tests/test_agent_harness_contract.py
    sources: [FB0041, IMP0035]
  counterexamples:
  - source: FB0041
    note: A local validation pass without a corresponding PR check leaves automation unable to satisfy or diagnose protected-branch policy.
  - source: IMP0035
    note: Required checks can pass while merge still fails if the command assumes a disabled merge method.
- id: role_scoped_harnessops_conduit
  name: Role-scoped HarnessOps conduit guidance
  capability: agent_bridge_distribution
  failure_class: missing_agents_hops_conduit
  applies_when:
  - Agents in linked repositories need AGENTS.md or CLAUDE.md to show how to invoke HarnessOps and which state path owns the work.
  - update-harness or packaged bridge assets refresh agent-facing instructions.
  avoid_when:
  - The guidance would duplicate a long skill body or blur project-repo feedback routing with target/meta lab routing.
  evidence:
  - source: FB0042
    note: The update-harness skill should notice missing minimal HarnessOps usage guidance and keep AGENTS.md/CLAUDE.md role-aware.
  - source: IMP0030
    note: Linked repositories need the `uvx --refresh-package harnessops --from harnessops hops update-harness` path when runtime and recorded versions drift.
  - source: IMP0037
    note: Global registry and storage=local support let ordinary repositories use HarnessOps without committing `.harnessops`, feedback, or lab files.
  guard:
  - path: tests/test_agent_harness_contract.py
    sources: [FB0042]
  - path: tests/test_cli/test_mvp_flow.py::test_project_link_storage_local_keeps_repo_clean; tests/test_cli/test_mvp_flow.py::test_agent_user_install_writes_global_codex_plugin; tests/test_agent_harness_contract.py::test_global_plugin_is_packaged_without_root_plugin_surface
    sources: [IMP0037]
  counterexamples:
  - source: FB0042
    note: Agent guidance that names HarnessOps without the invocation path or role routing leaves target/project repos to invent local conventions again.
  - source: IMP0037
    note: Writing local-only HarnessOps working state into ordinary repositories can block dirty-worktree automations and confuse canonical project state.
- id: harnessops_gitignore_hygiene
  name: HarnessOps transient gitignore hygiene
  capability: managed_artifact_update
  failure_class: transient_state_not_ignored
  applies_when:
  - A repository is initialized, linked, or updated by HarnessOps and local cache/tmp paths may be produced by ordinary CLI use.
  - '`.harnessops/cache/` must keep `.gitkeep` trackable while ignoring runtime files such as update notice cache JSON.'
  avoid_when:
  - 'The path is canonical project state such as `.harnessops/project.toml`, `.harnessops/lock.json`, migrations, feedback records, or lab records.'
  evidence:
  - source: FB0038
    note: HarnessOps already writes `.harnessops/cache/update-notice.json`; init/link/update-harness should maintain a marker-managed ignore block instead of leaving users to discover untracked cache files.
  guard:
  - path: tests/test_cli/test_mvp_flow.py::test_init_doctor_migrate_project; tests/test_cli/test_mvp_flow.py::test_update_harness_repairs_harnessops_gitignore_block
    sources: [FB0038]
  counterexamples:
  - source: FB0038
    note: Ignoring all of `.harnessops/` would hide canonical lock/project/migration state and break the audit trail.
- id: concise_review_surface
  name: Concise generated review surface
  capability: lab_evaluation_review
  failure_class: eval_template_noise_in_dossier
  applies_when:
  - Generated dossiers or views are meant to help readers review current state quickly.
  - Eval records exist mainly to anchor hypotheses and decisions, while manual scores carry the review signal.
  avoid_when:
  - The full record body is the actual subject of review.
  evidence:
  - source: IMP0003
    note: Per-improvement dossiers reduce cross-file scanning while preserving normalized records.
  - source: IMP0013
    note: Dossiers now summarize eval records and manual eval outputs instead of embedding template bodies.
  guard:
  - path: tests/test_cli/test_mvp_flow.py
    sources: [IMP0013]
  counterexamples:
  - source: IMP0013
    note: Deleting eval-case records entirely would remove the hook used by hypotheses and decisions.
- id: managed_artifact_conflict_awareness
  name: Conflict-aware managed artifact refresh
  capability: managed_artifact_update
  failure_class: stale_managed_file_reported_ok
  applies_when:
  - A packaged skill, bridge file, generated view, or other managed artifact can be locally edited.
  - An update command must report whether it changed, skipped, or wrote a conflict copy.
  avoid_when:
  - The artifact is purely generated and explicitly safe to overwrite.
  evidence:
  - source: IMP0002
    note: Managed bridge hashes let unmodified stale files update while local edits get `.new` files.
  - source: IMP0011
    note: Source-feedback locking and doctor uniqueness checks prevent duplicate dossier creation under concurrent lab commands.
  guard:
  - path: tests/test_cli/test_mvp_flow.py
    sources: [IMP0011]
  counterexamples:
  - source: IMP0002
    note: A blunt force mode can refresh stale files but cannot protect local edits.
- id: packaged_skill_asset_sync
  name: Packaged skill asset sync
  capability: agent_asset_packaging
  failure_class: manual_packaged_skill_sync_drift
  applies_when:
  - Repo-local HOPS skills under `.agents/skills/hops-*` are edited in the HarnessOps implementation repo.
  - Packaged Codex and Claude skill assets need to stay byte-for-byte aligned with repo-local skills.
  avoid_when:
  - A target or project repository is only installing repo-local skills; use `hops agent bridge` or `hops update-harness --agent-bridge` there.
  evidence:
  - source: FB0051
    note: Manual copy work left Claude packaged assets drifted; `hops agent sync-packaged-skills --check` detects drift and normal execution synchronizes both hosts.
  guard:
  - path: tests/test_cli/test_agent.py
    sources: [FB0051]
  counterexamples:
  - source: FB0051
    note: Updating only Codex assets or only touched skills lets packaged hosts drift despite repo-local skill tests passing.
- id: doctor_aligned_generated_view_refresh
  name: Doctor-aligned generated view refresh
  capability: generated_view_management
  failure_class: stale_generated_view_repair_gap
  applies_when:
  - A command claims to refresh generated lab views or managed artifacts.
  - Doctor validates managed file hashes for a broader artifact set than the refresh command currently writes.
  avoid_when:
  - The artifact is intentionally user-maintained and should no longer be in the managed lock.
  evidence:
  - source: RS0002
    note: The research scan showed doctor warnings remained after `hops lab refresh-views` because README, backlog, and score-trajectory were still stale.
  - source: IMP0016
    note: '`hops lab refresh-views` now refreshes doctor-managed overlay artifacts before regenerating dynamic lab views.'
  guard:
  - path: tests/test_cli/test_mvp_flow.py
    sources: [IMP0016]
  counterexamples:
  - source: RS0002
    note: Partial refresh commands train operators to ignore warning output even when doctor reports `ok`.
- id: canonical_record_identity
  name: Canonical record identity before broad lookup
  capability: record_lookup
  failure_class: generated_view_shadowed_record_id
  applies_when:
  - Resolving IDs such as FB, E, H, D, IMP, or RS in a tree that also contains generated views.
  - Generated views can contain the same visible ID as a canonical record.
  avoid_when:
  - The caller explicitly asks for a generated view path.
  evidence:
  - source: IMP0012
    note: '`find_record` now searches the canonical directory implied by known ID prefixes before broad overlay lookup.'
  - source: IMP0011
    note: Duplicate source-feedback mappings must be surfaced by doctor rather than hidden by broad scans.
  guard:
  - path: tests/test_cli/test_mvp_flow.py
    sources: [IMP0011, IMP0012]
  counterexamples:
  - source: IMP0012
    note: Rerunning eval by ID resolved to a generated manual-score view before canonical lookup was preferred.
- id: privacy_and_encoding_safe_remote_paths
  name: Privacy- and encoding-safe remote paths
  capability: remote_feedback_workflow
  failure_class: unsanitized_or_misdecoded_remote_context
  applies_when:
  - Importing issue JSON, creating issue drafts, citing external evidence, or moving lab-first records toward a remote issue.
  - Windows console encoding or remote publication can corrupt or leak context.
  avoid_when:
  - The workflow stays entirely local and contains no Unicode or private context risk.
  evidence:
  - source: IMP0004
    note: Lab-first issue drafts/creation sanitize bodies, search duplicates, require confirmation, and write back created URLs.
  - source: IMP0005
    note: GitHub issue import now decodes `gh` output as UTF-8 and tests Unicode Japanese issue content.
  - source: IMP0008
    note: Manual meta-research must be privacy-aware when using external evidence.
  guard:
  - path: tests/test_cli/test_mvp_flow.py
    sources: [IMP0004]
  counterexamples:
  - source: IMP0005
    note: Default Windows console decoding can break JSON reads and erase the original error path.
